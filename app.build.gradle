plugins { id 'com.android.application' }
android {
    namespace 'com.timmy.litetv'
    compileSdk 34
    defaultConfig { applicationId 'com.timmy.litetv'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled true; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
